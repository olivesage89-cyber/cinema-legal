<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trailer</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
  iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .msg{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;
       font:600 14px -apple-system,system-ui,sans-serif;color:#8f8b83;}
</style>
</head>
<body>
<script>
/* Cinema — trailer host page.
   The app loads this page in a small frame and passes a YouTube id: trailer.html?v=KEY
   This exists because the app's own pages load from local files, and YouTube refuses to
   play when there is no real web address behind the player (error 153). Served from
   GitHub Pages there is one, so playback works normally. */
(function(){
  var m = location.search.match(/[?&]v=([A-Za-z0-9_-]{5,24})/);
  var key = m ? m[1] : '';
  if(!key){
    document.body.innerHTML = '<div class="msg">No trailer</div>';
    return;
  }
  var f = document.createElement('iframe');
  f.setAttribute('allow','autoplay; encrypted-media; fullscreen; picture-in-picture');
  f.setAttribute('allowfullscreen','');
  f.setAttribute('frameborder','0');
  f.src = 'https://www.youtube.com/embed/' + key +
          '?autoplay=1&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
