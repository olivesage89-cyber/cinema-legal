<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cinema Creator Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a sticky header with status tabs, then one card per applicant with its next action. */
:root{
  --ink:#0b0b0e; --panel:#151419; --panel2:#1c1b21; --line:rgba(246,244,241,.10);
  --paper:#F6F4F1; --stone:#E4DED2; --muted:#a29d95; --coral:#F95C4B;
  --new:#7aa7ff; --acc:#5fd39a; --dec:#8d8a84; --paid:#f5c451; --wait:#c49bff;
  --display:"Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  --body:"Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.025em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
a{color:var(--coral)}

/* login */
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center}
.login form{width:min(360px,100%);display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.login h1{font-size:26px}
.login p{margin:0;color:var(--muted);font-size:14px}
input,select,textarea{width:100%;background:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;background:var(--panel2);color:var(--paper);border:1px solid var(--line)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.good{background:var(--acc);border-color:var(--acc);color:#0b0b0e}
.btn.danger{background:#e5484d;border-color:#e5484d;color:#fff}
.payerr{margin:0 4px 0 0;align-self:center;color:#ff8a7c;font-size:13.5px}
.sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheetbox{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheetk{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--paid)}
.sheetbox h3{font-size:24px}
.sheetd{margin:0;display:grid;gap:8px;font-size:14px}
.sheetd div{display:flex;justify-content:space-between;gap:12px} .sheetd dt{color:var(--muted)} .sheetd dd{margin:0;text-align:right}
.slider{--fill:0px;position:relative;height:58px;border-radius:999px;background:var(--ink);border:1px solid var(--line);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.slider::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--fill);background:rgba(245,196,81,.18)}
.slabel{position:absolute;inset:0;display:grid;place-items:center;padding-left:40px;font-weight:600;font-size:15px;color:var(--stone);pointer-events:none}
.knob{position:absolute;top:4px;left:4px;width:50px;height:50px;border-radius:50%;border:0;background:var(--paid);color:#0b0b0e;font-size:22px;font-weight:700;cursor:grab;touch-action:none}
.knob:active{cursor:grabbing}
.slider.done .knob{background:var(--acc)}
.sheetx{justify-self:center}
.btn.paidok{background:rgba(95,211,154,.14);border-color:rgba(95,211,154,.35);color:var(--acc);cursor:default}
.btn.gold{background:var(--paid);border-color:var(--paid);color:#0b0b0e}
.btn:disabled{opacity:.5;cursor:default}
.err{color:#ff8a7c;font-size:14px;margin:0;min-height:1em}

/* layout: a sidebar with two groups (Hiring, Pay), and the list on the right */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;background:#0e0d11}
.side h1{font-size:21px;padding:0 10px}
.side nav{display:grid;gap:18px}
.grp{display:grid;gap:6px}
.grp>small{padding:0 12px 6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tab{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 12px;font-size:14.5px;font-weight:500;color:var(--stone);text-align:left}
.tab:hover{background:var(--panel2);color:var(--paper)}
.tab[aria-pressed="true"]{background:var(--paper);border-color:var(--paper);color:var(--ink);font-weight:600}
.tab[aria-pressed="true"] i{box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.tab i{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dot,var(--muted))}
.tab span{margin-left:auto;font-size:12.5px;font-weight:700;min-width:22px;text-align:center;border-radius:999px;padding:1px 7px;background:var(--panel);color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"] span{background:var(--ink);color:var(--paper)}
.tab span{background:var(--ink)}
.stats{margin-top:auto;display:grid;gap:8px;padding:14px 12px 4px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.stats b{color:var(--paper);font-size:16px;margin-right:4px}
.main{min-width:0}
header{position:sticky;top:0;z-index:5;background:rgba(11,11,14,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:18px 28px}
.bar .ttl{flex:1 1 auto;min-width:0}
.bar h2{font-size:22px}
.secsub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.search{max-width:240px}
#list{padding:18px 28px 40px;max-width:1040px}
@media (max-width:820px){
  .shell{display:block}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;gap:12px}
  .side nav{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
  .grp{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .grp>small{padding:0 4px 0 0}
  .tab{width:auto;white-space:nowrap;padding:7px 10px}
  .stats{display:none}
  .bar{padding:14px 16px} #list{padding:14px 16px 32px}
}

/* cards: name + status on top, a tidy grid of details, then note + actions on one line */
main{padding-block:16px 40px;display:grid;gap:12px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:16px}
.head{display:flex;align-items:center;gap:12px;min-width:0}
.av{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font:800 16px var(--display);color:var(--stone)}
.who{flex:1 1 auto;min-width:0}
.who h3{font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;color:var(--muted);text-decoration:none;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.sub:hover{color:var(--paper)}
.sub svg{flex:0 0 auto;opacity:.7}
.meta{flex:0 0 auto;display:grid;justify-items:end;gap:4px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px 3px 8px;background:var(--panel2)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.new{color:var(--new)} .status.accepted{color:var(--paid)} .status.declined{color:var(--dec)} .status.paid{color:var(--acc)} .status.waitlist{color:var(--wait)}
.when{color:var(--muted);font-size:12.5px;white-space:nowrap}
.info{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.info div{background:var(--panel);padding:10px 12px;min-width:0}
/* the last box stretches to fill its row, so there's never an empty grey gap */
.info div:last-child:nth-child(3n+1){grid-column:1/-1} .info div:last-child:nth-child(3n+2){grid-column:span 2}
.info dt{color:var(--muted);font-size:12px;margin-bottom:2px}
.info dd{margin:0;font-size:14.5px;display:flex;align-items:center;gap:6px;min-width:0}
.info dd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.copy{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--muted);padding:0}
.copy:hover{background:var(--panel2);color:var(--paper)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.foot .noteIn{flex:1 1 220px;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;font-size:14px;color:var(--stone)}
.foot .noteIn:hover{border-color:var(--line)} .foot .noteIn:focus{border-color:var(--line);background:var(--ink)}
.foot .noteIn::placeholder{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.actions .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;font-size:14.5px}
.btn.ghost{background:none}
.next{margin:-4px 0 0;font-size:13.5px;color:var(--muted)} .next b{color:var(--stone);font-weight:700}
.pay{display:grid;gap:14px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.payhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.paylbl{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--paid)}
.rule{font-size:13px;color:var(--muted)} .rule b{color:var(--paper);font-weight:600}
.payrow{display:grid;grid-template-columns:minmax(150px,210px) auto minmax(0,1fr) auto;gap:18px;align-items:center}
.fld{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.fld input{height:46px;font-size:16px;font-variant-numeric:tabular-nums}
.arrow{color:var(--muted);font-size:20px;padding-top:20px}
.owed{display:grid;gap:2px;min-width:0}
.amt{display:grid;gap:2px}
.amt small{font-size:12.5px;color:var(--muted)}
.amt span{display:flex;align-items:baseline;gap:1px;font:700 32px/1.1 var(--display);letter-spacing:-.02em;color:var(--paper)}
.amt input{width:6.5ch;border:0;border-bottom:1.5px dashed transparent;border-radius:0;background:none;padding:0;font:inherit;letter-spacing:inherit;color:inherit;-moz-appearance:textfield}
.amt input::-webkit-outer-spin-button,.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amt input:hover,.amt input:focus{border-bottom-color:var(--muted);outline:none}
.calc{margin:0;font-size:13px;color:var(--muted)}
.pay .actions{margin:0;padding-top:18px}
@media (max-width:640px){ .payrow{grid-template-columns:1fr;gap:12px} .arrow{display:none} .pay .actions{padding-top:0} .pay .actions .btn{flex:1;justify-content:center} }
.note{font-size:13.5px;color:var(--muted)}
textarea{min-height:40px;resize:vertical;font-size:14px}
@media (max-width:720px){ .info{grid-template-columns:repeat(2,minmax(0,1fr))} .info div:last-child:nth-child(n){grid-column:auto} .info div:last-child:nth-child(odd){grid-column:1/-1} }
@media (max-width:460px){ .info{grid-template-columns:1fr} .info div:last-child:nth-child(n){grid-column:auto} .card{padding:16px} .actions{margin-left:0;width:100%} .actions .btn{flex:1;justify-content:center} }
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:700;border-radius:999px;padding:10px 18px;font-size:14px;z-index:20}
@media (max-width:560px){ .search{max-width:none;width:100%} .when{margin-left:0;width:100%} }
</style>
</head>
<body>

<section class="login" id="login">
  <form id="loginForm" class="wrap">
    <h1>Creator Desk</h1>
    <p>Private page for the Cinema team.</p>
    <label for="pw" class="note">Admin password<input id="pw" type="password" autocomplete="current-password"></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary" type="submit" id="loginBtn">Open</button>
  </form>
</section>

<div id="app" class="shell" hidden>
  <aside class="side">
    <h1>Creator Desk</h1>
    <nav id="tabs" aria-label="Sections"></nav>
    <div class="stats" id="stats"></div>
  </aside>
  <div class="main">
    <header>
      <div class="bar">
        <div class="ttl"><h2 id="secTitle">Applicants</h2><p class="secsub" id="secSub"></p></div>
        <input class="search" id="q" type="search" placeholder="Search name, email, link" aria-label="Search creators">
        <button class="btn" id="refresh" type="button">Refresh</button>
      </div>
    </header>
    <main id="list"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var FN = "https://pujsrxpveyecbogqnmad.supabase.co/functions/v1/creators-admin";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1anNyeHB2ZXllY2JvZ3FubWFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzA0NDksImV4cCI6MjEwMTY0NjQ0OX0.1R4Gfb0VbJwEG-Hhmtgs0RB92PFts_mwf4BEF5pfi00";
  var CREATORS_PAGE = "https://getcinema.app/creators";
  var APP = "https://apps.apple.com/us/app/cinema-identify-movies/id6800555477";
  var pw = ""; try{ pw = sessionStorage.getItem("cdesk") || ""; }catch(e){}
  var rows = [], filter = "new", q = "";
  /* sidebar sections: [status, name, colour, what this list is] */
  var GROUPS = [
    ["", [["employees","Employees","--coral","Creators you're working with. Enter their views after 7 days and pay them here."]]],
    ["Hiring", [["new","Applicants","--new","New applications to review."],["waitlist","Wait list","--wait","Good fits, waiting for a spot."],["declined","Declined","--dec","People you said no to."]]],
    ["Pay", [["paid","Paid","--acc","Creators you've paid."]]]
  ];

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function toast(t){ var el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){ el.hidden=true; },2600); }
  function money(n){ n=Number(n)||0; return "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:n%1?2:0}); }

  function call(body){
    body.password = pw;
    return fetch(FN,{method:"POST",headers:{"Content-Type":"application/json","apikey":ANON,"Authorization":"Bearer "+ANON},body:JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ if(!r.ok){ var e=new Error(j.error||("status "+r.status)); e.code=j.error; e.detail=j.detail; throw e; } return j; }); });
  }

  /* what a creator is owed for one video, from their plan and views (null = work it out by hand) */
  /* each plan's rules, exactly as on the creators page */
  var RULES={
    "Base + Milestone":"$20 per video · $120 total at 100k views · $220 at 500k · $520 at 1M",
    "Base + Views":"$50 per video + $0.50 per 1,000 views · max $1,500",
    "Views only":"$1 per 1,000 views · max $1,000"
  };
  /* "120k", "1.2M", "120,000" -> 120000 */
  function parseViews(t){ t=String(t||"").trim().toLowerCase().replace(/[, ]/g,""); if(!t) return null;
    var m=t.match(/^(\d+(?:\.\d+)?)([km]?)$/); if(!m) return NaN;
    return Math.round(Number(m[1])*(m[2]==="k"?1e3:m[2]==="m"?1e6:1)); }
  function nf(n){ return Number(n).toLocaleString("en-US"); }
  /* how the pay was worked out, in plain words */
  function explain(plan, views){
    if(views==null) return {amt:null, why:"Type their views and the pay works itself out."};
    if(isNaN(views)) return {amt:null, why:"Type views as a number, like 120000 or 120k."};
    var amt=payout(plan, views), k=views/1000;
    if(amt==null) return {amt:null, why:"No set rules for this plan. Type the amount by hand."};
    var why;
    if(plan==="Base + Milestone"){
      var tier=views>=1e6?"passed 1M":views>=5e5?"passed 500k":views>=1e5?"passed 100k":"under 100k, so base pay only";
      var next=views>=1e6?"":views>=5e5?" Next: $520 at 1M.":views>=1e5?" Next: $220 at 500k.":" Next: $120 at 100k.";
      why=nf(views)+" views, "+tier+"."+next;
    } else if(plan==="Base + Views"){
      var raw=50+0.5*k; why=nf(views)+" views: $50 + "+nf(Math.round(k*10)/10)+" × $0.50 = "+money(raw)+(raw>1500?", capped at $1,500":"");
    } else { var raw2=k; why=nf(views)+" views: "+nf(Math.round(k*10)/10)+" × $1 = "+money(raw2)+(raw2>1000?", capped at $1,000":""); }
    return {amt:Math.round(amt*100)/100, why:why};
  }
  /* what's happening with this person, and what to do next */
  var NEXT={
    new:"Decide: accept, wait list or decline.",
    waitlist:"On hold. Accept them when a spot opens.",
    accepted:"Waiting for their video. 7 days after they post, they email their views. Enter them below, send the money, then press Pay.",
    paid:"Paid for their latest video. When they post another one, press New video to pay them again.",
    declined:"Closed. They were sent a decline email."
  };

  function payout(plan, views){
    views = Number(views)||0;
    if(plan==="Base + Milestone") return views>=1000000?520:views>=500000?220:views>=100000?120:20;
    if(plan==="Base + Views") return Math.min(1500, 50 + 0.5*views/1000);
    if(plan==="Views only") return Math.min(1000, views/1000);
    return null;
  }
  /* older applications kept extra answers in the "idea" column */
  function extra(r, key){
    if(r[key]) return r[key];
    var m=String(r.idea||"").match(key==="pay_handle"?/Pay to: ([^·]+)/:key==="avg_views"?/Avg views: ([^·]+)/:/Phone: ([^·]+)/);
    return m?m[1].trim():"";
  }
  function first(n){ return String(n||"").trim().split(/\s+/)[0] || "there"; }

  function gmail(to, subject, body){
    window.open("https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(to)+"&su="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body),"_blank","noopener");
  }
  var MAIL = {
    accepted: function(r){ return ["You're in! Welcome to Cinema 🎬",
      "Hi "+first(r.name)+",\n\nWe loved your page and we'd love to work with you on the "+r.plan+" plan!\n\n"+
      "Here's what to do next:\n1. Download Cinema: "+APP+"\n2. Pick one of the 3 video styles: "+CREATORS_PAGE+"\n"+
      "3. 7 days after posting, reply with your video link and a screenshot of your views.\n\n"+
      "We pay within 3 days of getting your screenshot.\n\nCan't wait to see what you make!\nThe Cinema team"]; },
    waitlist: function(r){ return ["You're on the list! 🎬",
      "Hi "+first(r.name)+",\n\nWe loved your application! Our creator spots are full right now, but you're on our wait list and near the front.\n\n"+
      "We'll email you as soon as a spot opens. In the meantime, feel free to try the app: "+APP+"\n\nTalk soon,\nThe Cinema team"]; },
    declined: function(r){ return ["Your Cinema creator application",
      "Hi "+first(r.name)+",\n\nThanks for your interest in Cinema. We had a lot of great applications, and we can't take everyone this round.\n\n"+
      "We appreciate your time and wish you the best of luck. If you'd like to try the app, it's free here: "+APP+"\n\nThanks again,\nThe Cinema team"]; },
    paid: function(r, amount, views){ return ["You've been paid for your Cinema video 💸",
      "Hi "+first(r.name)+",\n\nWe just sent "+money(amount)+" by "+(r.payout||"your chosen method")+" to "+(extra(r,"pay_handle")||"your account")+
      (views?(" for your video ("+Number(views).toLocaleString("en-US")+" views)"):"")+".\n\nThank you for creating with us. Want to make another one? Just reply to this email.\n\nCinema on the App Store: "+APP+"\n\nThe Cinema team"]; }
  };

  /* PAYOUTS_ON: flip to true once a bank/payout service is connected in the creators-admin function.
     Then "Pay" sends the money first and only moves them to Paid if it goes through. */
  var PAYOUTS_ON = false;
  var payFail = {}, payDraft = {}, justPaid = {};   /* by id: why the last payment failed, and what was typed */
  function update(r, fields, mailKey, extraArgs, strict){
    /* open the email first, inside the click, so the browser doesn't block the new tab */
    if(mailKey){ var m=MAIL[mailKey].apply(null,[r].concat(extraArgs||[])); gmail(r.email, m[0], m[1]); }
    return call({action:"update", id:r.id, fields:fields}).then(function(j){
      if(j.row){ for(var i=0;i<rows.length;i++) if(rows[i].id===r.id) rows[i]=j.row; }
      render(); toast(mailKey?"Saved. Your email is ready in Gmail.":"Saved");
    }).catch(function(e){
      if(/column|views|paid_amount|paid_at|notes/i.test(String(e.detail||"")))
        toast("Run the admin setup SQL in Supabase first");
      else toast("Couldn't save. Try again.");
      if(strict) throw e;
    });
  }

  function counts(){ var c={all:rows.length,new:0,waitlist:0,accepted:0,paid:0,declined:0}; rows.forEach(function(r){ c[r.status||"new"]=(c[r.status||"new"]||0)+1; }); c.employees=c.accepted+c.paid; return c; }

  function render(){
    var c=counts(), total=0; rows.forEach(function(r){ total+= r.total_paid!=null ? Number(r.total_paid)||0 : (r.status==="paid"?Number(r.paid_amount)||0:0); });
    $("stats").innerHTML="<div><b>"+c.all+"</b>applied</div><div><b>"+c.accepted+"</b>making videos</div><div><b>"+money(total)+"</b>paid out</div>";
    $("tabs").innerHTML=GROUPS.map(function(g){ return '<div class="grp" role="group"'+(g[0]?' aria-label="'+g[0]+'"><small>'+g[0]+'</small>':'>')+
      g[1].map(function(t){ if(filter===t[0]){ $("secTitle").textContent=t[1]; $("secSub").textContent=t[3]; }
        return '<button type="button" class="tab" data-f="'+t[0]+'" aria-pressed="'+(filter===t[0])+'" style="--dot:var('+t[2]+')"><i></i>'+t[1]+'<span>'+(c[t[0]]||0)+'</span></button>'; }).join("")+'</div>'; }).join("");
    var list=rows.filter(function(r){ var s=r.status||"new"; if(filter==="employees"){ if(s!=="accepted" && s!=="paid") return false; } else if(filter!=="all" && s!==filter) return false;
      if(!q) return true; return (r.name+" "+r.email+" "+r.handle+" "+(r.phone||"")).toLowerCase().indexOf(q)>=0; });
    if(!list.length){ $("list").innerHTML='<p class="empty">'+(rows.length?"Nobody here yet.":"No applications yet. Share your creators page to get some.")+'</p>'; return; }
    $("list").innerHTML=list.map(card).join("");
  }

  var ICON={
    copy:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    out:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>',
    mail:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>'
  };
  var LABEL={new:"New",waitlist:"Wait list",accepted:"Accepted",declined:"Declined",paid:"Paid"};
  /* turn a messy profile URL into "Instagram · @name" plus a clean link without tracking junk */
  function profile(link){
    link=String(link||"").trim(); if(!link) return {text:"–",href:""};
    try{
      var u=new URL(/^https?:\/\//i.test(link)?link:"https://"+link), host=u.hostname.replace(/^(www\.|m\.)/,"");
      var site={"instagram.com":"Instagram","tiktok.com":"TikTok","youtube.com":"YouTube","youtu.be":"YouTube","x.com":"X","twitter.com":"X","facebook.com":"Facebook","snapchat.com":"Snapchat","threads.net":"Threads"}[host]||host;
      var parts=u.pathname.split("/").filter(Boolean).filter(function(p){ return !/^(c|user|channel|add)$/i.test(p); });
      var h=parts[0]?decodeURIComponent(parts[0]):""; if(h && h[0]!=="@") h="@"+h;
      return {text:site+(h?" · "+h:""), href:u.origin+u.pathname};
    }catch(e){ return {text:link,href:""}; }
  }
  function phoneFmt(p){ var d=String(p||"").replace(/\D/g,""); if(d.length===11&&d[0]==="1") d=d.slice(1);
    return d.length===10?"("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6):String(p||""); }
  function cell(label, value, copyVal){
    return '<div><dt>'+label+'</dt><dd><span title="'+esc(value)+'">'+esc(value||"–")+'</span>'+
      (copyVal?'<button class="copy" type="button" data-copy="'+esc(copyVal)+'" aria-label="Copy '+label.toLowerCase()+'" title="Copy">'+ICON.copy+'</button>':'')+'</dd></div>';
  }

  function card(r){
    var s=r.status||"new", when=new Date(r.created_at), payTo=extra(r,"pay_handle"), views=extra(r,"avg_views"), phone=extra(r,"phone"), pr=profile(r.handle);
    var h='<article class="card" data-s="'+s+'" data-id="'+r.id+'">'+
      '<div class="head"><div class="av" aria-hidden="true">'+esc((String(r.name||"?").trim()[0]||"?").toUpperCase())+'</div>'+
        '<div class="who"><h3>'+esc(r.name)+'</h3>'+
          (pr.href?'<a class="sub" href="'+esc(pr.href)+'" target="_blank" rel="noopener">'+esc(pr.text)+ICON.out+'</a>':'<span class="sub">'+esc(pr.text)+'</span>')+'</div>'+
        '<div class="meta">'+(s==="accepted"?'':'<span class="status '+s+'">'+LABEL[s]+'</span>')+'<span class="when">'+
          when.toLocaleDateString("en-US",{month:"short",day:"numeric"})+", "+when.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})+'</span></div></div>'+
      '<p class="next"><b>Next:</b> '+NEXT[s]+'</p>'+
      '<dl class="info">'+
        cell("Plan", r.plan)+
        cell("Followers", r.followers)+
        cell("Avg views", views)+
        cell("Email", r.email, r.email)+
        cell("Phone", phone?phoneFmt(phone):"–")+
        cell("Pay by "+(r.payout||"–"), payTo, payTo)+
        ((s==="accepted"||s==="paid")&&Number(r.videos_paid)>0?cell("Total paid", money(r.total_paid)+" · "+r.videos_paid+" video"+(r.videos_paid==1?"":"s")):"")+
        (s==="paid"?cell("Last payment", money(r.paid_amount)+(r.paid_at?" on "+new Date(r.paid_at).toLocaleDateString("en-US",{month:"short",day:"numeric"}):""))+cell("Views", r.views?Number(r.views).toLocaleString("en-US"):"–")+cell("Notes", r.notes||"–"):"")+
      '</dl>';
    if(s==="accepted"){
      var dr=payDraft[r.id], ex=explain(r.plan, dr?parseViews(dr.v):(r.views!=null?Number(r.views):null));
      h+='<div class="pay"><div class="payhead"><span class="paylbl">Payout</span><span class="rule"><b>'+esc(r.plan||"No plan")+'</b> · '+esc(RULES[r.plan]||"set the amount by hand")+'</span></div>'+
         '<div class="payrow">'+
           '<label class="fld">Views after 7 days<input type="text" inputmode="numeric" autocomplete="off" data-f="views" value="'+esc(dr?dr.v:(r.views!=null?nf(r.views):""))+'" placeholder="e.g. 120k"></label>'+
           '<span class="arrow" aria-hidden="true">→</span>'+
           '<div class="owed"><label class="amt"><small>You pay</small><span>$<input type="number" min="0" step="0.01" inputmode="decimal" data-f="amount" value="'+esc(dr?dr.a:(ex.amt!=null?ex.amt:""))+'" placeholder="0" aria-label="Amount to pay in dollars"></span></label>'+
           '<p class="calc" aria-live="polite">'+esc(ex.why)+'</p></div>'+
         '<div class="actions">'+(payFail[r.id]?'<p class="payerr" role="alert">'+esc(payFail[r.id])+'</p><button class="btn danger" data-act="paid">Try again</button>':
           '<button class="btn gold" data-act="paid" title="'+(PAYOUTS_ON?"Sends the money, then moves them to Paid.":"Press after you have sent the money. Marks them Paid and opens the paid email.")+'">'+"Pay"+'</button>')+'</div></div></div>';
    }
    h+='<div class="foot"><input class="noteIn" data-f="notes" type="text" placeholder="Add a note…" value="'+esc(r.notes||"")+'" aria-label="Note">';
    if(s==="new") h+='<div class="actions"><button class="btn ghost" data-act="decline">'+ICON.mail+'Decline</button><button class="btn ghost" data-act="waitlist">'+ICON.mail+'Wait list</button><button class="btn good" data-act="accept">'+ICON.mail+'Accept</button></div>';
    if(s==="waitlist") h+='<div class="actions"><button class="btn ghost" data-act="decline">'+ICON.mail+'Decline</button><button class="btn good" data-act="accept">'+ICON.mail+'Accept</button></div>';
    if(s==="declined") h+='<div class="actions"><button class="btn ghost" data-act="undo">Back to New</button></div>';
    if(s==="paid") h+='<div class="actions"><button class="btn ghost" data-act="mailpaid">'+ICON.mail+'Email</button>'+
      (justPaid[r.id]?'<span class="btn paidok" role="status">✓ Paid</span>':'<button class="btn gold" data-act="newvideo">New video</button>')+'</div>';
    return h+'</div></article>';
  }

  /* slide-to-pay sheet: shows who/how much, and only confirms when the knob reaches the end */
  function confirmPay(r, amt, views, onOk){
    var old=$("slideSheet"); if(old) old.remove();
    var el=document.createElement("div"); el.id="slideSheet"; el.className="sheet"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-labelledby","sheetT");
    el.innerHTML='<div class="sheetbox"><p class="sheetk">Confirm payment</p><h3 id="sheetT">Pay '+esc(first(r.name))+' '+money(amt)+'</h3>'+
      '<dl class="sheetd"><div><dt>To</dt><dd>'+esc(r.payout||"–")+' · '+esc(extra(r,"pay_handle")||"–")+'</dd></div>'+
      '<div><dt>For</dt><dd>'+(views?nf(views)+' views · ':'')+esc(r.plan||"")+'</dd></div></dl>'+
      '<div class="slider" id="slider"><span class="slabel">Slide to pay '+money(amt)+'</span><button type="button" class="knob" id="knob" role="slider" aria-label="Slide to pay" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">→</button></div>'+
      '<button type="button" class="btn ghost sheetx" id="sheetCancel">Cancel</button></div>';
    document.body.appendChild(el);
    var track=$("slider"), knob=$("knob"), x0=0, dragging=false, pos=0;
    function max(){ return track.clientWidth-knob.offsetWidth-8; }
    function set(px){ pos=Math.max(0,Math.min(max(),px)); knob.style.transform="translateX("+pos+"px)"; track.style.setProperty("--fill",(pos+knob.offsetWidth/2+4)+"px");
      knob.setAttribute("aria-valuenow",Math.round(pos/max()*100)); track.querySelector(".slabel").style.opacity=String(1-pos/max()); }
    function close(){ el.remove(); document.removeEventListener("keydown",onKey); }
    function finish(){ track.classList.add("done"); knob.textContent="✓"; close(); onOk(); }
    function snapBack(){ knob.style.transition="transform .25s ease"; set(0); setTimeout(function(){ knob.style.transition=""; },260); }
    knob.addEventListener("pointerdown",function(e){ dragging=true; x0=e.clientX-pos; knob.setPointerCapture(e.pointerId); });
    knob.addEventListener("pointermove",function(e){ if(dragging) set(e.clientX-x0); });
    knob.addEventListener("pointerup",function(){ if(!dragging) return; dragging=false; if(pos>=max()-2) finish(); else snapBack(); });
    knob.addEventListener("pointercancel",function(){ dragging=false; snapBack(); });
    knob.addEventListener("keydown",function(e){ if(e.key==="ArrowRight"){ e.preventDefault(); set(pos+max()/4); if(pos>=max()-2) finish(); } else if(e.key==="ArrowLeft"){ e.preventDefault(); set(pos-max()/4); } else if(e.key==="End"){ e.preventDefault(); set(max()); finish(); } });
    function onKey(e){ if(e.key==="Escape") close(); }
    document.addEventListener("keydown",onKey);
    $("sheetCancel").addEventListener("click",close);
    el.addEventListener("click",function(e){ if(e.target===el) close(); });
    knob.focus();
  }

  function byId(id){ for(var i=0;i<rows.length;i++) if(String(rows[i].id)===String(id)) return rows[i]; return null; }

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-f].tab, .tab"); if(t){ filter=t.getAttribute("data-f"); render(); return; }
    var c=e.target.closest("[data-copy]"); if(c){ var txt=c.getAttribute("data-copy");
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast("Copied");},function(){toast(txt);}); return; }
    var b=e.target.closest("[data-act]"); if(!b) return;
    var cardEl=b.closest(".card"), r=byId(cardEl.getAttribute("data-id")); if(!r) return;
    var act=b.getAttribute("data-act");
    if(act==="accept") update(r,{status:"accepted"},"accepted");
    else if(act==="decline") update(r,{status:"declined"},"declined");
    else if(act==="waitlist") update(r,{status:"waitlist"},"waitlist");
    else if(act==="undo") update(r,{status:"new"});
    else if(act==="newvideo") update(r,{status:"accepted",views:null,paid_amount:null,paid_at:null});
    else if(act==="paid"){
      var v=parseViews(cardEl.querySelector('[data-f="views"]').value), a=cardEl.querySelector('[data-f="amount"]').value;
      if(v!=null && isNaN(v)){ toast("Views should be a number, like 120k"); return; }
      if(a===""){ toast("Add the amount to pay first"); return; }
      var amt=Number(a);
      /* nothing is paid until the slider is dragged all the way */
      confirmPay(r, amt, v, function(){ pay(); });
      function pay(){
      var fields={status:"paid",views:v,paid_amount:amt,paid_at:new Date().toISOString(),
        total_paid:Math.round(((Number(r.total_paid)||0)+amt)*100)/100, videos_paid:(Number(r.videos_paid)||0)+1};
      payDraft[r.id]={v:cardEl.querySelector('[data-f="views"]').value, a:a};
      function failed(e){ payFail[r.id]=/declin/i.test(String(e&&e.code))?"Your card was declined.":"The payment didn't go through."; render(); }
      function done(){ delete payFail[r.id]; delete payDraft[r.id];
        /* show "✓ Paid" on the button for a moment, then it becomes "New video" */
        justPaid[r.id]=1; render(); setTimeout(function(){ delete justPaid[r.id]; render(); },2500); }
      b.disabled=true; b.textContent=PAYOUTS_ON?"Paying…":"Saving…";
      if(PAYOUTS_ON){
        /* send the money first; the paid email is opened from the Paid card afterwards (a browser blocks it after a wait) */
        call({action:"pay", id:r.id, amount:amt})
          .then(function(){ return update(r, fields, null, null, true); })
          .then(function(){ done(); toast("Paid "+money(amt)+". Press Email to let them know."); }, failed);
      } else {
        update(r, fields, "paid", [amt, v||0], true).then(done, failed);
      }
      }
    }
    else if(act==="mailpaid"){ var mm=MAIL.paid(r, Number(r.paid_amount)||0, Number(r.views)||0); gmail(r.email, mm[0], mm[1]); }
  });
  /* typing views fills in the amount from the creator's plan */
  document.addEventListener("input",function(e){
    var el=e.target; if(el.getAttribute("data-f")==="views"){ var cardEl=el.closest(".card"), r=byId(cardEl.getAttribute("data-id"));
      var ex=explain(r.plan, parseViews(el.value)); cardEl.querySelector('.calc').textContent=ex.why;
      cardEl.querySelector('[data-f="amount"]').value = ex.amt!=null ? ex.amt : ""; }
    if(el.id==="q"){ q=el.value.trim().toLowerCase(); render(); }
  });
  document.addEventListener("change",function(e){
    var el=e.target; if(el.getAttribute("data-f")!=="notes") return;
    var r=byId(el.closest(".card").getAttribute("data-id")); if(r && (r.notes||"")!==el.value){ r.notes=el.value; update(r,{notes:el.value}); }
  });

  function load(){ return call({action:"list"}).then(function(j){ rows=j.rows||[]; render(); }); }
  $("refresh").addEventListener("click",function(){ load().then(function(){toast("Up to date");}).catch(function(){toast("Couldn't refresh");}); });

  function open(){
    $("loginBtn").disabled=true; $("loginErr").textContent="";
    load().then(function(){ try{ sessionStorage.setItem("cdesk",pw); }catch(e){}
      $("login").hidden=true; $("app").hidden=false; })
    .catch(function(e){ pw=""; try{ sessionStorage.removeItem("cdesk"); }catch(_){}
      $("loginErr").textContent = e.code==="wrong_password" ? "That password isn't right." : "Couldn't reach the server. Check the function is deployed.";
    }).then(function(){ $("loginBtn").disabled=false; });
  }
  $("loginForm").addEventListener("submit",function(e){ e.preventDefault(); pw=$("pw").value; if(pw) open(); });
  if(pw) open();
})();
</script>
</body>
</html>
