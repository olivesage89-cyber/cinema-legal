<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cinema Creator Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: a sticky header with status tabs, then one card per applicant with its next action. */
:root{
  --ink:#0b0b0e; --panel:#151419; --panel2:#1c1b21; --line:rgba(246,244,241,.10);
  --paper:#F6F4F1; --stone:#E4DED2; --muted:#a29d95; --coral:#F95C4B;
  --new:#7aa7ff; --acc:#5fd39a; --dec:#8d8a84; --paid:#f5c451;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --body:"DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
a{color:var(--coral)}

/* login */
[hidden]{display:none!important}
.login{min-height:100vh;display:grid;place-items:center}
.login form{width:min(360px,100%);display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.login h1{font-size:26px}
.login p{margin:0;color:var(--muted);font-size:14px}
input,select,textarea{width:100%;background:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;background:var(--panel2);color:var(--paper);border:1px solid var(--line)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.good{background:var(--acc);border-color:var(--acc);color:#0b0b0e}
.btn.gold{background:var(--paid);border-color:var(--paid);color:#0b0b0e}
.btn:disabled{opacity:.5;cursor:default}
.err{color:#ff8a7c;font-size:14px;margin:0;min-height:1em}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,11,14,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px 10px}
.bar h1{font-size:22px;flex:1 1 auto}
.stats{display:flex;gap:14px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.stats b{color:var(--paper)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--stone)}
.tab[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tab span{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.search{max-width:260px}

/* cards */
main{padding-block:16px 40px;display:grid;gap:12px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.card[data-s="new"]{border-left-color:var(--new)} .card[data-s="accepted"]{border-left-color:var(--acc)}
.card[data-s="declined"]{border-left-color:var(--dec)} .card[data-s="paid"]{border-left-color:var(--paid)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.top h3{font-size:19px}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--panel2)}
.pill.new{color:var(--new)} .pill.accepted{color:var(--acc)} .pill.declined{color:var(--dec)} .pill.paid{color:var(--paid)}
.when{margin-left:auto;color:var(--muted);font-size:13px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;font-size:14px}
.facts div{min-width:0}
.facts small{display:block;color:var(--muted);font-size:12px}
.facts .v{overflow-wrap:anywhere}
.copy{border:0;background:none;color:var(--coral);font-weight:700;font-size:12.5px;padding:0 0 0 6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pay{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--panel2);border-radius:12px;padding:12px}
.pay label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.pay input{width:140px}
.note{font-size:13.5px;color:var(--muted)}
textarea{min-height:40px;resize:vertical;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:700;border-radius:999px;padding:10px 18px;font-size:14px;z-index:20}
@media (max-width:560px){ .search{max-width:none;width:100%} .when{margin-left:0;width:100%} }
</style>
</head>
<body>

<section class="login" id="login">
  <form id="loginForm" class="wrap">
    <h1>Creator Desk</h1>
    <p>Private page for the Cinema team.</p>
    <label for="pw" class="note">Admin password<input id="pw" type="password" autocomplete="current-password"></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary" type="submit" id="loginBtn">Open</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="bar">
        <h1>Creator Desk</h1>
        <div class="stats" id="stats"></div>
        <input class="search" id="q" type="search" placeholder="Search name, email, link" aria-label="Search applicants">
        <button class="btn" id="refresh" type="button">Refresh</button>
      </div>
      <div class="tabs" id="tabs" role="group" aria-label="Filter by status"></div>
    </div>
  </header>
  <main class="wrap" id="list"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var FN = "https://pujsrxpveyecbogqnmad.supabase.co/functions/v1/creators-admin";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1anNyeHB2ZXllY2JvZ3FubWFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzA0NDksImV4cCI6MjEwMTY0NjQ0OX0.1R4Gfb0VbJwEG-Hhmtgs0RB92PFts_mwf4BEF5pfi00";
  var CREATORS_PAGE = "https://getcinema.app/creators";
  var APP = "https://apps.apple.com/us/app/cinema-identify-movies/id6800555477";
  var pw = ""; try{ pw = sessionStorage.getItem("cdesk") || ""; }catch(e){}
  var rows = [], filter = "new", q = "";
  var TABS = [["new","New"],["accepted","Accepted"],["paid","Paid"],["declined","Declined"],["all","All"]];

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function toast(t){ var el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){ el.hidden=true; },2600); }
  function money(n){ n=Number(n)||0; return "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:n%1?2:0}); }

  function call(body){
    body.password = pw;
    return fetch(FN,{method:"POST",headers:{"Content-Type":"application/json","apikey":ANON,"Authorization":"Bearer "+ANON},body:JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ if(!r.ok){ var e=new Error(j.error||("status "+r.status)); e.code=j.error; e.detail=j.detail; throw e; } return j; }); });
  }

  /* what a creator is owed for one video, from their plan and views (null = work it out by hand) */
  function payout(plan, views){
    views = Number(views)||0;
    if(plan==="Base + Milestone") return views>=1000000?520:views>=500000?220:views>=100000?120:20;
    if(plan==="Base + Views") return Math.min(1500, 50 + 0.5*views/1000);
    if(plan==="Views only") return Math.min(1000, views/1000);
    return null;
  }
  /* older applications kept extra answers in the "idea" column */
  function extra(r, key){
    if(r[key]) return r[key];
    var m=String(r.idea||"").match(key==="pay_handle"?/Pay to: ([^·]+)/:key==="avg_views"?/Avg views: ([^·]+)/:/Phone: ([^·]+)/);
    return m?m[1].trim():"";
  }
  function first(n){ return String(n||"").trim().split(/\s+/)[0] || "there"; }

  function gmail(to, subject, body){
    window.open("https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(to)+"&su="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body),"_blank","noopener");
  }
  var MAIL = {
    accepted: function(r){ return ["You're in! Creating for Cinema 🎬",
      "Hi "+first(r.name)+",\n\nThanks for applying. We'd love to work with you on the "+r.plan+" plan.\n\n"+
      "Next steps:\n1. Download Cinema: "+APP+"\n2. Pick one of the 3 video styles on our creators page: "+CREATORS_PAGE+"\n"+
      "3. Post it on your account, labelled as a paid partnership.\n4. 7 days after posting, reply to this email with your video link and a screenshot of your views. We'll pay you within 3 days.\n\n"+
      "Excited to see what you make!\nThe Cinema team"]; },
    declined: function(r){ return ["Your Cinema creator application",
      "Hi "+first(r.name)+",\n\nThanks so much for applying to create for Cinema. We can't take you on right now, but we'll keep your details and reach out if that changes.\n\n"+
      "In the meantime, the app is free to try: "+APP+"\n\nThanks again,\nThe Cinema team"]; },
    paid: function(r, amount, views){ return ["You've been paid for your Cinema video 💸",
      "Hi "+first(r.name)+",\n\nWe just sent "+money(amount)+" by "+(r.payout||"your chosen method")+" to "+(extra(r,"pay_handle")||"your account")+
      (views?(" for your video ("+Number(views).toLocaleString("en-US")+" views)"):"")+".\n\nThank you for creating with us. Want to make another one? Just reply to this email.\n\nThe Cinema team"]; }
  };

  function update(r, fields, mailKey, extraArgs){
    /* open the email first, inside the click, so the browser doesn't block the new tab */
    if(mailKey){ var m=MAIL[mailKey].apply(null,[r].concat(extraArgs||[])); gmail(r.email, m[0], m[1]); }
    return call({action:"update", id:r.id, fields:fields}).then(function(j){
      if(j.row){ for(var i=0;i<rows.length;i++) if(rows[i].id===r.id) rows[i]=j.row; }
      render(); toast(mailKey?"Saved. Your email is ready in Gmail.":"Saved");
    }).catch(function(e){
      if(/column|views|paid_amount|paid_at|notes/i.test(String(e.detail||"")))
        toast("Run the admin setup SQL in Supabase first");
      else toast("Couldn't save. Try again.");
    });
  }

  function counts(){ var c={all:rows.length,new:0,accepted:0,paid:0,declined:0}; rows.forEach(function(r){ c[r.status||"new"]=(c[r.status||"new"]||0)+1; }); return c; }

  function render(){
    var c=counts(), total=0; rows.forEach(function(r){ if(r.status==="paid") total+=Number(r.paid_amount)||0; });
    $("stats").innerHTML="<span><b>"+c.all+"</b> applied</span><span><b>"+c.accepted+"</b> active</span><span><b>"+money(total)+"</b> paid out</span>";
    $("tabs").innerHTML=TABS.map(function(t){ return '<button type="button" class="tab" data-f="'+t[0]+'" aria-pressed="'+(filter===t[0])+'">'+t[1]+'<span>'+(c[t[0]]||0)+'</span></button>'; }).join("");
    var list=rows.filter(function(r){ var s=r.status||"new"; if(filter!=="all" && s!==filter) return false;
      if(!q) return true; return (r.name+" "+r.email+" "+r.handle+" "+(r.phone||"")).toLowerCase().indexOf(q)>=0; });
    if(!list.length){ $("list").innerHTML='<p class="empty">'+(rows.length?"Nobody here yet.":"No applications yet. Share your creators page to get some.")+'</p>'; return; }
    $("list").innerHTML=list.map(card).join("");
  }

  function card(r){
    var s=r.status||"new", when=new Date(r.created_at), payTo=extra(r,"pay_handle"), views=extra(r,"avg_views"), phone=extra(r,"phone");
    var link=String(r.handle||""), href=/^https?:\/\//i.test(link)?link:"";
    var h='<article class="card" data-s="'+s+'" data-id="'+r.id+'">'+
      '<div class="top"><h3>'+esc(r.name)+'</h3><span class="pill '+s+'">'+s+'</span><span class="pill">'+esc(r.plan)+'</span>'+
      '<span class="when">'+when.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" · "+when.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})+'</span></div>'+
      '<div class="facts">'+
        '<div><small>Profile</small><span class="v">'+(href?'<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(link.replace(/^https?:\/\/(www\.)?/i,""))+'</a>':esc(link))+'</span></div>'+
        '<div><small>Email</small><span class="v">'+esc(r.email)+'</span><button class="copy" data-copy="'+esc(r.email)+'">Copy</button></div>'+
        (phone?'<div><small>Phone</small><span class="v">'+esc(phone)+'</span></div>':'')+
        '<div><small>Followers · avg views</small><span class="v">'+esc(r.followers||"–")+" · "+esc(views||"–")+'</span></div>'+
        '<div><small>Pay by '+esc(r.payout||"–")+'</small><span class="v">'+esc(payTo||"–")+'</span>'+(payTo?'<button class="copy" data-copy="'+esc(payTo)+'">Copy</button>':'')+'</div>'+
        (s==="paid"?'<div><small>Paid</small><span class="v">'+money(r.paid_amount)+(r.views?" · "+Number(r.views).toLocaleString("en-US")+" views":"")+(r.paid_at?" · "+new Date(r.paid_at).toLocaleDateString("en-US",{month:"short",day:"numeric"}):"")+'</span></div>':'')+
      '</div>';
    if(s==="new") h+='<div class="actions"><button class="btn good" data-act="accept">Accept + email</button><button class="btn" data-act="decline">Decline + email</button></div>';
    if(s==="accepted"){
      var est=r.views?payout(r.plan,r.views):null;
      h+='<div class="pay"><label>Views after 7 days<input type="number" min="0" step="1" inputmode="numeric" data-f="views" value="'+(r.views||"")+'" placeholder="e.g. 120000"></label>'+
         '<label>Amount to pay ($)<input type="number" min="0" step="0.01" inputmode="decimal" data-f="amount" value="'+(est!=null?est:"")+'" placeholder="'+(payout(r.plan,0)==null?"Enter by hand":"Auto from views")+'"></label>'+
         '<button class="btn gold" data-act="paid">Mark paid + email</button><button class="btn" data-act="undo">Back to New</button></div>';
    }
    if(s==="declined"||s==="paid") h+='<div class="actions"><button class="btn" data-act="'+(s==="paid"?"unpay":"undo")+'">'+(s==="paid"?"Undo paid":"Back to New")+'</button></div>';
    h+='<label class="note">Notes<textarea data-f="notes" placeholder="Video link, anything to remember…">'+esc(r.notes||"")+'</textarea></label></article>';
    return h;
  }

  function byId(id){ for(var i=0;i<rows.length;i++) if(String(rows[i].id)===String(id)) return rows[i]; return null; }

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-f].tab, .tab"); if(t){ filter=t.getAttribute("data-f"); render(); return; }
    var c=e.target.closest("[data-copy]"); if(c){ var txt=c.getAttribute("data-copy");
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast("Copied");},function(){toast(txt);}); return; }
    var b=e.target.closest("[data-act]"); if(!b) return;
    var cardEl=b.closest(".card"), r=byId(cardEl.getAttribute("data-id")); if(!r) return;
    var act=b.getAttribute("data-act");
    if(act==="accept") update(r,{status:"accepted"},"accepted");
    else if(act==="decline") update(r,{status:"declined"},"declined");
    else if(act==="undo") update(r,{status:"new"});
    else if(act==="unpay") update(r,{status:"accepted",paid_amount:null,paid_at:null});
    else if(act==="paid"){
      var v=cardEl.querySelector('[data-f="views"]').value, a=cardEl.querySelector('[data-f="amount"]').value;
      if(a===""){ toast("Add the amount to pay first"); return; }
      update(r,{status:"paid",views:v===""?null:Math.round(Number(v)),paid_amount:Number(a),paid_at:new Date().toISOString()},"paid",[Number(a),v===""?0:Number(v)]);
    }
  });
  /* typing views fills in the amount from the creator's plan */
  document.addEventListener("input",function(e){
    var el=e.target; if(el.getAttribute("data-f")==="views"){ var cardEl=el.closest(".card"), r=byId(cardEl.getAttribute("data-id"));
      var p=payout(r.plan, el.value); if(p!=null) cardEl.querySelector('[data-f="amount"]').value=Math.round(p*100)/100; }
    if(el.id==="q"){ q=el.value.trim().toLowerCase(); render(); }
  });
  document.addEventListener("change",function(e){
    var el=e.target; if(el.getAttribute("data-f")!=="notes") return;
    var r=byId(el.closest(".card").getAttribute("data-id")); if(r && (r.notes||"")!==el.value){ r.notes=el.value; update(r,{notes:el.value}); }
  });

  function load(){ return call({action:"list"}).then(function(j){ rows=j.rows||[]; render(); }); }
  $("refresh").addEventListener("click",function(){ load().then(function(){toast("Up to date");}).catch(function(){toast("Couldn't refresh");}); });

  function open(){
    $("loginBtn").disabled=true; $("loginErr").textContent="";
    load().then(function(){ try{ sessionStorage.setItem("cdesk",pw); }catch(e){}
      $("login").hidden=true; $("app").hidden=false; })
    .catch(function(e){ pw=""; try{ sessionStorage.removeItem("cdesk"); }catch(_){}
      $("loginErr").textContent = e.code==="wrong_password" ? "That password isn't right." : "Couldn't reach the server. Check the function is deployed.";
    }).then(function(){ $("loginBtn").disabled=false; });
  }
  $("loginForm").addEventListener("submit",function(e){ e.preventDefault(); pw=$("pw").value; if(pw) open(); });
  if(pw) open();
})();
</script>
</body>
</html>
