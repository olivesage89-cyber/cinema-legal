<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trailer</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#tap{position:absolute;inset:0;z-index:5}
#end{position:absolute;inset:0;z-index:7;display:none;place-items:center;background-size:cover;background-position:center}
#end.on{display:grid}
#end:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.c{position:relative;width:58px;height:58px;border-radius:999px;background:rgba(18,17,21,.5);border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.c svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><script>
var k=(location.search.match(/[?&]v=([A-Za-z0-9_-]{5,24})/)||[])[1];
if(k){
var f=document.createElement('iframe');
f.allow='autoplay; encrypted-media; fullscreen';
f.src='https://www.youtube.com/embed/'+k+'?autoplay=1&playsinline=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&enablejsapi=1';
document.body.appendChild(f);
var t=document.createElement('div');t.id='tap';document.body.appendChild(t);
var e=document.createElement('div');e.id='end';
e.style.backgroundImage="url('https://i.ytimg.com/vi/"+k+"/maxresdefault.jpg'),url('https://i.ytimg.com/vi/"+k+"/hqdefault.jpg')";
e.innerHTML='<div class="c"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/></svg></div>';
document.body.appendChild(e);
function c(fn,a){try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:a||[]}),'*')}catch(x){}}
var done=false,play=true;
function fin(){if(done)return;done=true;c('pauseVideo');e.className='on';}
e.onclick=function(ev){ev.stopPropagation();done=false;play=true;e.className='';c('seekTo',[0,true]);c('playVideo');};
t.onclick=function(){if(done)return;play=!play;c(play?'playVideo':'pauseVideo');};
addEventListener('message',function(ev){
if(String(ev.origin).indexOf('youtube')<0)return;var d;try{d=JSON.parse(ev.data)}catch(x){return}
var i=d&&d.info;
if(i&&i.duration>0&&typeof i.currentTime=='number'&&i.currentTime>=Math.max(1,i.duration-5))fin();
var s=(d.event=='onStateChange')?i:(i&&typeof i.playerState=='number'?i.playerState:null);
if(s===0)fin();
});
setInterval(function(){try{f.contentWindow.postMessage('{"event":"listening","id":1,"channel":"widget"}','*')}catch(x){}},350);
}
</script></body></html>
