<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trailer</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#ui{position:absolute;inset:0;z-index:5}
#cv{position:absolute;inset:0;z-index:7;background:#000;background-size:cover;background-position:center;
opacity:1;transition:opacity .32s ease}
#cv.off{opacity:0;pointer-events:none}
#cv:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}
#btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);z-index:9;
width:74px;height:74px;border-radius:999px;background:rgba(0,0,0,.55);border:0;
display:grid;place-items:center;
opacity:0;pointer-events:none;transition:opacity .26s ease,transform .26s ease}
#btn.on{opacity:1;pointer-events:auto}
#btn.hide{transform:translate(-50%,-50%) scale(.86)}
#btn:active{transform:translate(-50%,-50%) scale(.93)}
#btn svg{width:36px;height:36px;fill:#fff}
</style></head><body><script>
var k=(location.search.match(/[?&]v=([A-Za-z0-9_-]{5,24})/)||[])[1];
if(k){
var HOLD=2900;
function trimFor(dur){ return dur>=120 ? 50 : (dur>=90 ? 35 : (dur>=45 ? 18 : Math.max(4, dur*0.18))); }
var PLAY='<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
var PAUSE='<svg viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>';
var f=document.createElement('iframe');
f.allow='autoplay; encrypted-media';
f.src='https://www.youtube.com/embed/'+k+
'?autoplay=0&playsinline=1&controls=0&rel=0&modestbranding=1'+
'&iv_load_policy=3&disablekb=1&fs=0&enablejsapi=1';
document.body.appendChild(f);
var ui=document.createElement('div');ui.id='ui';document.body.appendChild(ui);
var cv=document.createElement('div');cv.id='cv';
cv.style.backgroundImage="url('https://i.ytimg.com/vi/"+k+"/hqdefault.jpg')";
document.body.appendChild(cv);
var btn=document.createElement('div');btn.id='btn';document.body.appendChild(btn);
function cmd(fn,a){try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:a||[]}),'*')}catch(x){}}
var playing=false, showBtn=true, T=null, A=null, lastEnd=0;
function draw(){
btn.innerHTML = playing ? PAUSE : PLAY;
var on = showBtn || !playing;
btn.classList.toggle('on', on);
btn.classList.toggle('hide', !on);
}
function flash(){
showBtn=true; draw(); clearTimeout(A);
A=setTimeout(function(){ if(playing){ showBtn=false; draw(); } },3000);
}
function play(){
playing=true; showBtn=false; clearTimeout(A); cmd('playVideo'); draw();
clearTimeout(T); T=setTimeout(function(){ if(playing) cv.classList.add('off'); }, HOLD);
}
function pause(){
playing=false; showBtn=true; clearTimeout(T); clearTimeout(A);
cmd('pauseVideo'); cv.classList.remove('off'); draw();
}
function finish(){
var now=Date.now(); if(now-lastEnd<2500)return; lastEnd=now;
playing=false; showBtn=true; clearTimeout(T); clearTimeout(A);
cmd('pauseVideo'); cmd('seekTo',[0,true]); cmd('pauseVideo');
cv.classList.remove('off'); draw();
}
ui.onclick=function(){ if(!playing){ play(); return; } flash(); };
cv.onclick=function(e){ e.stopPropagation(); if(!playing) play(); else flash(); };
btn.onclick=function(e){ e.stopPropagation(); playing ? pause() : play(); };
addEventListener('message',function(ev){
if(String(ev.origin).indexOf('youtube')<0)return;
var d;try{d=JSON.parse(ev.data)}catch(x){return}
var i=d&&d.info;
if(playing && i && i.duration>0 && typeof i.currentTime==='number' &&
i.currentTime>=Math.max(1,i.duration-trimFor(i.duration))) finish();
var s=(d.event==='onStateChange')?i:(i&&typeof i.playerState==='number'?i.playerState:null);
if(s===0) finish();
});
document.addEventListener('visibilitychange',function(){ if(document.hidden && playing) pause(); });
setInterval(function(){try{f.contentWindow.postMessage('{"event":"listening","id":1,"channel":"widget"}','*')}catch(x){}},300);
draw();
}
</script></body></html>
