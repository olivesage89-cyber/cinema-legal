<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trailer</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#cv{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:#000;
background-size:cover;background-position:center;transition:opacity .3s ease}
#cv.off{opacity:0;pointer-events:none}
#cv:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}
#btn{position:relative;width:74px;height:74px;border-radius:999px;background:rgba(0,0,0,.55);
display:grid;place-items:center;transition:transform .14s ease}
#cv:active #btn{transform:scale(.93)}
#btn svg{width:36px;height:36px;fill:#fff}
</style></head><body><script>
var k=(location.search.match(/[?&]v=([A-Za-z0-9_-]{5,24})/)||[])[1];
if(k){
var TRIM=5;
var f=document.createElement('iframe');
f.allow='autoplay; encrypted-media; fullscreen';
f.setAttribute('allowfullscreen','');
f.src='https://www.youtube.com/embed/'+k+
'?autoplay=0&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&enablejsapi=1';
document.body.appendChild(f);
var cv=document.createElement('div');cv.id='cv';
cv.style.backgroundImage="url('https://i.ytimg.com/vi/"+k+"/hqdefault.jpg')";
cv.innerHTML='<div id="btn"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></div>';
document.body.appendChild(cv);
function cmd(fn,a){try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:a||[]}),'*')}catch(x){}}
var playing=false, lastEnd=0;
cv.onclick=function(){ playing=true; cmd('playVideo'); cv.classList.add('off'); };
function finish(){
var now=Date.now(); if(now-lastEnd<2500)return; lastEnd=now;
playing=false; cmd('pauseVideo'); cmd('seekTo',[0,true]); cmd('pauseVideo');
cv.classList.remove('off');
}
addEventListener('message',function(ev){
if(String(ev.origin).indexOf('youtube')<0)return;
var d;try{d=JSON.parse(ev.data)}catch(x){return}
var i=d&&d.info;
if(playing && i && i.duration>0 && typeof i.currentTime==='number' &&
i.currentTime>=Math.max(1,i.duration-TRIM)) finish();
var s=(d.event==='onStateChange')?i:(i&&typeof i.playerState==='number'?i.playerState:null);
if(s===0) finish();
});
setInterval(function(){try{f.contentWindow.postMessage('{"event":"listening","id":1,"channel":"widget"}','*')}catch(x){}},300);
}
</script></body></html>
