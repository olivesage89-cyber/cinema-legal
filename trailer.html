<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trailer</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#tap{position:absolute;inset:0;z-index:5}
#cv{position:absolute;inset:0;z-index:7;background:#000;background-size:cover;background-position:center;transition:opacity .35s ease}
#cv.off{opacity:0;pointer-events:none}
#cv:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}
#btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;
width:62px;height:62px;border-radius:999px;background:rgba(18,17,21,.5);
border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
opacity:0;pointer-events:none;transition:opacity .22s ease,transform .14s ease}
#btn.on{opacity:1;pointer-events:auto}
#btn:active{transform:translate(-50%,-50%) scale(.93)}
#btn svg{width:24px;height:24px;fill:#fff}
</style></head><body><script>
var k=(location.search.match(/[?&]v=([A-Za-z0-9_-]{5,24})/)||[])[1];
if(k){
var AUTO=!/[?&]auto=0/.test(location.search);
var HOLD=1200;
var TRIM=5;
var PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
var PAUSE='<svg viewBox="0 0 24 24"><path d="M9 5h3v14H9zM14 5h3v14h-3z"/></svg>';
var f=document.createElement('iframe');
f.allow='autoplay; encrypted-media; fullscreen';
f.src='https://www.youtube.com/embed/'+k+'?autoplay='+(AUTO?1:0)+
'&playsinline=1&controls=0&rel=0&modestbranding=1'+
'&iv_load_policy=3&disablekb=1&fs=0&enablejsapi=1';
document.body.appendChild(f);
var t=document.createElement('div');t.id='tap';document.body.appendChild(t);
var cv=document.createElement('div');cv.id='cv';
cv.style.backgroundImage="url('https://i.ytimg.com/vi/"+k+"/hqdefault.jpg')";
document.body.appendChild(cv);
var btn=document.createElement('div');btn.id='btn';document.body.appendChild(btn);
function cmd(fn,a){try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:a||[]}),'*')}catch(x){}}
var playing=AUTO, hidden=false, covered=true, T=null, lastRestart=0;
function draw(){
cv.classList.toggle('off', !covered);
var show = !hidden || !playing;
btn.innerHTML = playing ? PAUSE : PLAY;
btn.classList.toggle('on', show);
}
function uncoverSoon(){
clearTimeout(T);
T=setTimeout(function(){ if(playing){ covered=false; hidden=true; draw(); } }, HOLD);
}
function play(){ playing=true; hidden=true; cmd('playVideo'); uncoverSoon(); draw(); }
function pause(){ playing=false; clearTimeout(T); cmd('pauseVideo'); covered=true; hidden=false; draw(); }
function restart(){
var now=Date.now(); if(now-lastRestart<2500)return; lastRestart=now;
cmd('seekTo',[0,true]); cmd('playVideo');
}
function sideTap(){ if(!playing)return; hidden=!hidden; draw(); }
t.onclick=sideTap;
cv.onclick=sideTap;
btn.onclick=function(e){ e.stopPropagation(); if(playing) pause(); else play(); };
addEventListener('message',function(ev){
if(String(ev.origin).indexOf('youtube')<0)return;
var d;try{d=JSON.parse(ev.data)}catch(x){return}
var i=d&&d.info;
if(playing && i && i.duration>0 && typeof i.currentTime==='number' &&
i.currentTime>=Math.max(1,i.duration-TRIM)) restart();
var s=(d.event==='onStateChange')?i:(i&&typeof i.playerState==='number'?i.playerState:null);
if(s===0) restart();
});
if(AUTO){ uncoverSoon(); }
draw();
setInterval(function(){try{f.contentWindow.postMessage('{"event":"listening","id":1,"channel":"widget"}','*')}catch(x){}},300);
}
</script></body></html>
